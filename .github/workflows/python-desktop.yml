name: Python desktop build
on:
  push:
    branches: [main, feature/python-desktop-app]
    tags: ['desktop-v*']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Tk libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libx11-6 xvfb xauth
      - name: Run headless regression tests
        run: python -m unittest discover -s desktop -p "test_*.py" -v
      - name: Run data and catalog integrity regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Test real Tkinter UI under a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python desktop/gui_smoke.py
      - name: Install standalone packager
        run: python -m pip install "pyinstaller>=6.11,<7"
      - name: Build native desktop binary
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EnergyMap --add-data "data:data" --add-data "assets:assets" desktop/energymap.py
      - name: Launch packaged Linux executable under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/package_smoke.py dist/EnergyMap --seconds 5
      - name: Launch packaged Windows executable
        if: runner.os == 'Windows'
        run: python scripts/package_smoke.py dist/EnergyMap.exe --seconds 5
      - name: Launch packaged macOS executable
        if: runner.os == 'macOS'
        run: python scripts/package_smoke.py dist/EnergyMap --seconds 5
      - name: Upload install-free desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: EnergyMap-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-windows-release:
    name: Publish stable Windows EXE download
    needs: test-and-package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: energymap-latest-release
      cancel-in-progress: false
    steps:
      - name: Download successfully tested Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: EnergyMap-Windows
          path: release
      - name: Verify executable and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -s release/EnergyMap.exe
          python3 -c "from pathlib import Path; p=Path('release/EnergyMap.exe'); assert p.stat().st_size > 1000000 and p.read_bytes()[:2] == b'MZ', 'Artifact is not a valid-sized Windows executable'"
          mv release/EnergyMap.exe release/EnergyMap-Windows.exe
          (cd release && sha256sum EnergyMap-Windows.exe > SHA256SUMS.txt)
      - name: Publish EXE as stable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Older builds can finish after a newer commit. Never replace a
          # newer release with an outdated artifact from an earlier run.
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Skipping obsolete build $GITHUB_SHA; current main is $main_sha"
            exit 0
          fi
          notes="$(printf 'EnergyMap for Windows (standalone EXE, Python not required).\n\nBuilt from main commit %s after successful Windows, macOS and Linux validation. Includes research data and map assets.\n\nVerify SHA-256 using the attached SHA256SUMS.txt before running.\n\nThis build is not code-signed.\n' "$GITHUB_SHA")"
          if gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload desktop-latest release/EnergyMap-Windows.exe release/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            # GitHub Actions may update release metadata and assets but
            # lacks permission to force-update the protected tag ref (HTTP 403).
            gh release edit desktop-latest --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EnergyMap for Windows — Latest Successful Build" \
              --notes "$notes" --latest
          else
            gh release create desktop-latest release/EnergyMap-Windows.exe release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "EnergyMap for Windows — Latest Successful Build" \
              --notes "$notes" --latest
          fi
          gh release view desktop-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep -Fx 'EnergyMap-Windows.exe'
