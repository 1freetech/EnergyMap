name: Validate energy atlas in Python

on:
  pull_request:
    paths:
      - "data/**"
      - "desktop/**"
      - "tests/**"
      - "README.md"
      - ".github/workflows/energy-map-validate.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "desktop/**"
      - "tests/**"
      - "README.md"
      - ".github/workflows/energy-map-validate.yml"
  workflow_dispatch:

jobs:
  validate-atlas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Validate rankings, operating plants, and Python-only source
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate Python desktop model
        run: python -m unittest discover -s desktop -p "test_*.py" -v
      - name: Compile Python modules
        run: python -m compileall -q desktop tests
